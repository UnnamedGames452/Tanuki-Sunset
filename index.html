<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | Tanuki Sunset</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>
  <script>
    var gameInstance = UnityLoader.instantiate("gameContainer", "Build/WebGL.json", {onProgress: UnityProgress});
  </script>
  
    <!-- This CSS block perfectly centers the game window at a 0.5 anchor point -->
  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important; 
      background-color: #000 !important; /* Changes the outer white space to clean black */
    }
    .webgl-content {
      position: absolute !important;
      top: 50% !important;   /* Move the top edge to the middle of the screen */
      left: 50% !important;  /* Move the left edge to the middle of the screen */
      transform: translate(-50%, -50%) !important; /* Shift back by 50% of the canvas size to center it */
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
    }
    #gameContainer {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <div class="webgl-content">
    <div id="gameContainer"></div>
    
    <!-- The footer is fully removed here to prevent overlapping the bottom navigation -->
  </div>
</body>
</html>
