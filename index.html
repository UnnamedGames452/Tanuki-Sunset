<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | Tanuki Sunset</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>
  <script>
    var gameInstance = UnityLoader.instantiate("gameContainer", "Build/WebGL.json", {onProgress: UnityProgress});
  </script>
  
  <!-- This updated CSS block forcefully overrides the template's style.css -->
  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important; /* Hides the white borders and scrollbars */
      background-color: #000 !important;
    }
    .webgl-content {
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      transform: none !important; /* Prevents Unity from centering the box mid-screen */
    }
    #gameContainer {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <div class="webgl-content">
    <div id="gameContainer"></div>
    
    <!-- The footer is fully removed here to prevent overlapping the bottom navigation -->
  </div>
</body>
</html>
