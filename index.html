<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | Tanuki Sunset</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>
  <script>
    var gameInstance = UnityLoader.instantiate("gameContainer", "Build/WebGL.json", {onProgress: UnityProgress});
  </script>
  
  <!-- Add this CSS block below to force windowed fullscreen -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Hides browser scrollbars */
      background-color: #000; /* Optional: Sets a black background */
    }
    .webgl-content {
      width: 100% !important;
      height: 100% !important;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div class="webgl-content">
    <!-- Changed width/height to 100% and removed the fixed pixel values -->
    <div id="gameContainer" style="width: 100%; height: 100%;"></div>
    
    <!-- Commented out or removed the footer so it doesn't overlap your gameplay -->
    <!-- 
    <div class="footer">
      <div class="webgl-logo"></div>
      <div class="fullscreen" onclick="gameInstance.SetFullscreen(1)"></div>
      <div class="title">Tanuki Sunset</div>
    </div> 
    -->
  </div>
</body>
</html>
